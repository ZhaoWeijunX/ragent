server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent${unique-name:}-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: postgres
    password: postgres
    url: jdbc:postgresql://${ragent.infra.host:localhost}:5432/ragent?client_encoding=UTF8
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RagentHikariPool

  data:
    redis:
      host: ${ragent.infra.host:localhost}
      port: 6379
      password: 123456

rocketmq:
  name-server: ${ragent.infra.host:localhost}:9876
  producer:
    group: ragent-producer${unique-name:}_pg
    send-message-timeout: 2000

ragent:
  engine:
    type: workflow  # 执行架构档位，可选 workflow（v1 编排管线）/ agent（v2 ReAct 架构，RAG 管线降级为主 Agent 的一个 Tool）
  demo-mode: false
  # 评测旁路 + 工作台（与 Chat Pipeline 隔离；生产请关闭 enabled / workbench-enabled / ragas.enabled）
  eval:
    # 旁路 GET /rag/eval；工作台双路径录制取证据依赖此开关，本地联调需 true
    enabled: true
    # 评测工作台 Admin API / Runner / 专用线程池 / 租约回收；生产请 false
    workbench-enabled: true
    max-active-runs: 1              # 同时处于录制阶段的最大 Run 数（共享环境务必保持 1）
    record-concurrency: 1           # 单 Run 内样本录制并发；勿与在线聊天线程池抢资源
    sample-timeout-seconds: 120     # 单样本录制超时（秒）
    sample-retry-times: 1           # 单样本失败后的额外重试次数
    record-thinking: false          # true 时把 thinking 写入 t_eval_record（MVP 默认关，注意脱敏）
    lease-heartbeat-seconds: 30     # Runner 租约心跳间隔（秒）
    lease-expire-seconds: 90        # 租约过期后由 EvalRunLeaseReclaimer 回收可恢复 Run
    # RAGAS LLM-as-judge：依赖外部 ragenteval HTTP 服务；失败不回滚 Record / 确定性分数
    # 联调：uvicorn eval.service.app:app --port 8089，再将 enabled 置 true；Run 创建仍须勾选「启用 RAGAS」
    ragas:
      enabled: ${RAGAS_ENABLED:false}                              # 全局总开关；false 时即使 Run.ragasEnabled=true 也跳过
      endpoint: ${RAGAS_ENDPOINT:http://127.0.0.1:8089}             # 评分服务 Base URL（无尾斜杠）；空则视为不可用
      service-token: ${RAGAS_SERVICE_TOKEN:}                        # 可选；与 ragenteval RAGENTEVAL_SERVICE_TOKEN 对齐，Bearer 鉴权
      concurrency: 2                                               # 预留：客户端侧并发上限（当前提交为整批一次）
      timeout-seconds: 180                                         # 单次 HTTP 超时（秒）；轮询总时限约为该值 ×10
      poll-interval-seconds: 10                                    # 轮询外部 job 固定间隔（秒），不做退避
      max-samples-per-run: 500                                     # 单次 RAGAS 批次最多送评样本数（超出截断）
      max-independent-runs: 1                                      # ragas_n（1–3）；>1 对同一样本多次采样取均值，成本倍增
      # Judge 专用聊天模型（与 ai.chat 业务档位分离）；embedding 仍用 ai.embedding
      # DeepSeek 侧用 v4-pro（指令遵循更稳，利于 faithfulness 等 JSON 解析）；flash 成本低但易 OutputParser 失败
      judge-chat:
        default-model: gpt-5.4-mini
        candidates:
          - id: deepseek-v4-pro
            provider: deepseek
            model: deepseek-v4-pro
          - id: gpt-5.4-mini
            provider: aihubmix
            model: gpt-5.4-mini

rag:
  storage:
    type: s3  # 可选 s3（rustfs / minio）/ oss（阿里云）
    kb-bucket: ragent-sources        # 全局知识库桶（私有），所有知识库文档按 collectionName 目录隔离；OSS 桶名全局唯一，生产需按部署覆盖
    asset-bucket: ragent-assets # 多模态资产桶（公共读），PDF 抽出的图片等供浏览器匿名直连预览
    s3:
      endpoint: http://${ragent.infra.host:localhost}:9000
      access-key: rustfsadmin
      secret-key: rustfsadmin
      region: us-east-1
      path-style: true
      public-url:  # 内外网端点不同时配置，留空回退 endpoint
    oss:
      endpoint: https://oss-cn-hangzhou.aliyuncs.com
      access-key: ${OSS_ACCESS_KEY:}
      secret-key: ${OSS_SECRET_KEY:}
      region: cn-hangzhou
      public-url:  # 虚拟主机式基址（含 bucket 子域），如 https://ragent-assets.oss-cn-hangzhou.aliyuncs.com；留空由 endpoint 推导

  vector:
    type: pg  # 可选 milvus / pg

  keyword:
    type: none  # 可选 none / es
    es:
      uris: http://127.0.0.1:9200
      index: rag_keyword_store  # 全库共享索引，按 collection_name 字段区分知识库
      analyzer: ik_max_word
      search-analyzer: ik_smart

  graph:
    type: none  # 图谱后端总开关，可选 none / lightrag。lightrag 即接入后端供「后台可视化 / 检索读取」；是否参与检索、是否写入分别由 rag.search.channels.graph.enabled 与下方 ingestion.enabled 独立控制
    lightrag:
      base-url: http://${ragent.infra.host:localhost}:9621
      query-mode: mix  # naive / local / global / hybrid / mix
      timeout-ms: 30000
    embedding-model: qwen-emb-8b  # 与 LightRAG 的 SiliconFlow Qwen3-Embedding-8B 配置一致
    ingestion:
      enabled: false           # 写入同步开关：false 冻结图谱写入（向量写不再重建图谱），仅保留可视化 / 检索读取，避免为不检索的图谱持续付出实体抽取成本；true 恢复随向量写自动同步
      async: true              # 标脏入队 + 后台防抖重建，不阻塞主写链路
      global-workspace: false  # 跨库方案B（独立全局图）；默认关，Phase1 用 fan-out 兜底

  default:
    collection-name: rag_default_store
    dimension: 1536
    metric-type: COSINE
    sse-timeout-ms: 300000  # SSE 全局超时（毫秒），默认 5 分钟

  query-rewrite:
    enabled: true

  rerank:
    enabled: true

  citation:
    enabled: true  # 回答行内引用角标 [N](#cite-N)：开启会动态追加引用规则并为资料注入编号，增加首字延迟；关闭不影响文档级来源面板

  rate-limit:
    global:
      enabled: true
      max-concurrent: 10
      max-wait-seconds: 15
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 8
    summary-enabled: true
    summary-start-turns: 9
    summary-max-chars: 400
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: http://localhost:9099

  search:
    # 检索漏斗三段预算，各自独立、单调收窄，启动时校验 recall-budget ≥ default-top-k 且 rerank-candidate-limit ≥ default-top-k
    default-top-k: 10           # ③ 最终进 LLM 的条数（产品语义的 topK）
    recall-budget: 20           # ① 每通道召回条数（绝对值，向量意图路/关键词/图谱共用）；须 ≥ default-top-k，0=回退 default-top-k
    # 检索作用域：本次请求该看哪些知识库，与用什么模态检索无关，故与 channels 平级、三条通道共读
    # 判定只看 KB 意图最高分，不看意图个数；关掉任一通道都不影响其余通道的作用域
    scope:
      min-intent-score: 0.4        # 低于此分的意图节点不参与「是否收窄」的判定
      confidence-threshold: 0.6    # KB 意图最高分低于此值 → 退化为全库检索
      supplement-ratio: 0.25       # 定向时各通道从自身产出额度划给「未命中库」的保底比例，兜住意图判错；0=关闭补充路，命中库已覆盖全库时自动不补
    channels:
      vector:
        enabled: true       # 向量通道总开关
        candidate-budget: 0 # 全局作用域取数上限；0=跟随 rerank-candidate-limit（超出即被下游截断属空转），确需更宽跨库广度时填正值
      keyword:
        enabled: false      # 检索范围读引擎解析好的作用域，与向量通道同源
      graph:
        enabled: false    # 图谱检索通道开关：false 不参与问答召回（后端仍在，后台可视化照常）；置 true 前需先开 rag.graph.type=lightrag
      web-search:
        enabled: false
        count: 5
        timeout-seconds: 10
        api-key: ${YDC_API_KEY:}
    fusion:
      strategy: rrf
      rrf-k: 20                   # 候选池通常仅 20~40 条，k=60 会过度平滑名次；调低至 20 让头部更有区分度（配合「检索归因」日志校准）
      rerank-candidate-limit: 40  # ② RRF 融合后送入 Rerank 的候选池上限，<=0 不截断（经验值 40~100）
      channel-weights:            # 各通道 RRF 贡献权重：向量最可信=1.0；图谱为新通道、跑在全局图上、证据仅经结果侧过滤，暂降权=0.5
        vector: 1.0
        keyword: 1.0
        graph: 0.5
        web-search: 0.5

  trace:
    enabled: true
    max-error-length: 1000

  debug:
    log-llm-input: false  # true 时在日志输出送入 LLM 的完整消息，排查内容审核拦截

  # 图片解析（图生文）配置
  # 产出一段自包含的知识文本：既说清"图是什么"，又完整保留所有文字与层级
  image-parse:
    description-prompt: |-
      请把这张图片的内容转写成一段自包含的知识文本，用于知识库检索与问答，不要描述颜色、布局、字体等视觉样式。要求：
      1. 开头用一两句话说明这张图是什么（主题、类型、用途），让人不看图也能明白讲的是什么。
      2. 随后按图中的分组、层级、流程关系，完整转写所有文字内容（OCR），保留每个分组标题与其下属条目的归属关系，不要遗漏任何文字。
      3. 若是图表、架构图或流程图，请补充说明各部分之间的关系（如包含、调用、先后顺序），而不只是罗列文字。
      4. 保持术语准确完整，表述贴近用户可能的提问方式。
      5. 最后另起一行，用一句话自然引出图片（例如"下方为该内容对应的原始图片："），以便在这段文字后紧接着展示图片。
    max-output-tokens: 4096

ai:
  providers:
    ollama:
      url: http://localhost:11434
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    aihubmix:
      url: https://aihubmix.com
      api-key: ${AIHUBMIX_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    deepseek:
      url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      endpoints:
        chat: /v1/chat/completions

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    candidates:
      - id: qwen-plus
        provider: bailian
        model: qwen-plus-latest
      - id: qwen-flash
        provider: bailian
        model: qwen-flash
      - id: qwen3-local
        provider: ollama
        model: qwen3:8b-fp16
      - id: qwen3-max
        provider: bailian
        model: qwen3-max
        supports-thinking: true
      - id: glm-4.7
        provider: siliconflow
        model: Pro/zai-org/GLM-4.7
        supports-thinking: true
      - id: gpt-5.4
        provider: aihubmix
        model: gpt-5.4
      - id: deepseek-v4-pro
        provider: deepseek
        model: deepseek-v4-pro
        supports-thinking: true

    default-tier: standard
    deep-thinking-tier: deep

    tiers:
      fast:
        candidates: [ qwen-flash, qwen-plus, qwen3-local ]
        timeout-ms: 5000
      standard:
        candidates: [ qwen3-max, qwen-plus, qwen3-local, gpt-5.4 ]
        timeout-ms: 30000
      deep:
        candidates: [ qwen3-max, glm-4.7, deepseek-v4-pro ]
        timeout-ms: 120000

  embedding:
    default-model: qwen-emb-8b
    candidates:
      - id: qwen-emb-8b
        provider: siliconflow
        model: Qwen/Qwen3-Embedding-8B
        dimension: ${rag.default.dimension}
        priority: 1
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: ${rag.default.dimension}
        priority: 2
      - id: text-embedding-3-large
        provider: aihubmix
        model: text-embedding-3-large
        dimension: ${rag.default.dimension}
        priority: 3

  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

  vlm:
    default-model: qwen-vl-max
    candidates:
      - id: qwen-vl-max
        provider: bailian
        model: qwen-vl-max

# 飞书 Open API（知识库 Remote URL 自动识别 /docx/、/wiki/ 链接时使用）
feishu:
  enabled: true
  app-id: ${FEISHU_APP_ID:}
  app-secret: ${FEISHU_APP_SECRET:}
  tenant-access-token: ${FEISHU_TENANT_TOKEN:}
  # pdf：异步导出 PDF（默认，走 MinerU 解析）；markdown / plain 保留兼容
  content-format: pdf
  fallback-on-error: true
  wiki-import:
    max-pages-per-job: 500
    rate-limit-per-minute: 90 # 小于飞书官网的 100/min

# MinerU SaaS API 配置（PDF / Word / PPT 走 MinerU 解析）
mineru:
  api-url: https://mineru.net/api/v4
  api-key: ${MINERU_API_KEY:}
  poll-interval-seconds: 5
  timeout-seconds: 300
  enable-table: true
  enable-formula: true
  ocr: false
  language: ch
  concurrency-limit: 5
  semaphore-name: rag:mineru:parse
  max-wait-seconds: 30
  lease-seconds: 900

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

logging:
  pattern:
    # 对齐沿用 Boot 默认：级别 %5p、线程 [%15.15t]、logger %-40.40；保留 %clr 颜色，去掉 PID / 应用名
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %msg%n"

milvus:
  uri: http://localhost:19530
